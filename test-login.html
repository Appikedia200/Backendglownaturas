<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #059669;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .success {
            background: #d1fae5;
            border: 1px solid #10b981;
        }
        .error {
            background: #fee2e2;
            border: 1px solid #ef4444;
        }
        .loading {
            background: #fef3c7;
            border: 1px solid #f59e0b;
        }
    </style>
</head>
<body>
    <h1>🔐 Test Backend Login</h1>
    <p>This will test if the backend login works from a browser</p>
    
    <button onclick="testLogin()">Test Login</button>
    
    <div id="result"></div>

    <script>
        async function testLogin() {
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'loading';
            resultDiv.textContent = '⏳ Testing login... (10 second timeout)';

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000);

            try {
                const response = await fetch('https://backendglownaturas.onrender.com/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'chisomokoli47@glownaturas.com',
                        password: 'Caption15$'
                    }),
                    credentials: 'include',
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                const data = await response.json();

                if (response.ok) {
                    resultDiv.className = 'success';
                    resultDiv.textContent = '✅ LOGIN SUCCESS!\n\n' + JSON.stringify(data, null, 2);
                } else {
                    resultDiv.className = 'error';
                    resultDiv.textContent = '❌ LOGIN FAILED!\n\nStatus: ' + response.status + '\n\n' + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                clearTimeout(timeoutId);
                resultDiv.className = 'error';
                
                if (error.name === 'AbortError') {
                    resultDiv.textContent = '❌ REQUEST TIMEOUT!\n\nThe request took more than 10 seconds.\nThis means the backend is not responding.';
                } else {
                    resultDiv.textContent = '❌ ERROR!\n\n' + error.message + '\n\n' + error.stack;
                }
            }
        }
    </script>
</body>
</html>
