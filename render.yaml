services:
  # GlowNatura Backend API
  - type: web
    name: glownatura-backend
    env: node
    region: ohio # Change to your preferred region
    plan: free # Options: free, starter, standard, pro
    branch: main # Change to your default branch if different
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    
    # Environment Variables
    envVars:
      - key: NODE_ENV
        value: production
      
      - key: PORT
        value: 5000
      
      # MongoDB - Add your MongoDB Atlas connection string
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard (Secret)
      
      # JWT Configuration
      - key: JWT_SECRET
        sync: false # Set in Render Dashboard (Secret)
      
      - key: JWT_EXPIRE
        value: 30d
      
      # Cloudinary Configuration
      - key: CLOUDINARY_CLOUD_NAME
        sync: false # Set in Render Dashboard (Secret)
      
      - key: CLOUDINARY_API_KEY
        sync: false # Set in Render Dashboard (Secret)
      
      - key: CLOUDINARY_API_SECRET
        sync: false # Set in Render Dashboard (Secret)
      
      # Brevo Email Configuration (API Method)
      - key: BREVO_API_KEY
        sync: false # Set in Render Dashboard (Secret)
      
      - key: FROM_EMAIL
        value: hello@glownaturas.com # Verified sender email
      
      - key: FROM_NAME
        value: GlowNatura
      
      # Admin Configuration
      - key: COMPANY_EMAIL_DOMAIN
        value: glownatura.com
      
      # Frontend URLs - Update these after deployment
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app # Update with your frontend URL

      - key: ADMIN_URL
        value: https://admin.glownaturas.com # Admin panel URL
    
    # Auto-deploy on push to main branch
    autoDeploy: true

